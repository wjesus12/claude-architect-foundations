<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Architect Foundations</title>
  <meta name="description" content="Entrenamiento para la certificación Claude Certified Architect – Foundations (CCAR-F): lecciones, simulacros, labs, arquitecturas y flashcards en inglés, español o modo híbrido.">
  <meta name="theme-color" content="#1b1815">

  <noscript>Este entrenamiento necesita JavaScript.</noscript>

  <!-- Pantalla de arranque / acceso -->
  <section id="gate" class="gate" hidden></section>

  <!-- Aplicación -->
  <div id="app" class="app" hidden>
    <header class="statusbar" id="statusbar"></header>
    <aside class="tree" id="tree" aria-label="Navegación"></aside>
    <main class="view" id="view" tabindex="-1"></main>
    <section class="term" id="term" aria-label="Terminal">
      <div class="term__log" id="termLog" role="log" aria-live="polite"></div>
      <form class="term__line" id="termForm" autocomplete="off">
        <label for="termInput" class="term__prompt">❯</label>
        <input id="termInput" class="term__input" spellcheck="false" placeholder="/help — escribe un comando o pulsa Tab">
        <span class="term__hint" id="termHint"></span>
      </form>
    </section>
    <button class="tree-toggle" id="treeToggle" aria-label="Abrir navegación" aria-expanded="false">☰</button>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
